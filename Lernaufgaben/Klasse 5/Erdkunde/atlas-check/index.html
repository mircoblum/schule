<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: eine Spalte wie ein Arbeitsblatt im Hefter. Karten im Stil einer politischen Atlaskarte: Länder in Pastellfarben, kräftige Grenzen, Namen. Füller-Blau als Akzent, Textmarker-Gelb für Markierungen. */
:root{
  --paper:#f3f6f6; --card:#ffffff; --ink:#15202b; --muted:#56636e; --line:#d5dde0;
  --pen:#2a3cb4; --pen-ink:#ffffff; --pen-soft:#e5e9fb;
  --ok:#1b7548; --ok-soft:#dcf0e4; --bad:#b0261d; --bad-soft:#fae3df;
  --marker:#ffd60a; --marker-op:.7;
  --water:#c9e0ee; --grat:#a9c8da; --border:#4b5560; --coast:#5d7d93;
  --c0:#f2e3b8; --c1:#d6e9c4; --c2:#f4d3c6; --c3:#d3e0f1; --c4:#e6d9ef; --c5:#e9e6bf;
  --nb:#e6e8e1; --de:#fff6d9; --state:#8f8a72;
  --river:#1f6fc2; --mt:#c79c74; --mt-edge:#7b5535; --city:#1a1d21; --halo:#ffffff; --clbl:#4c5a66;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Kalam", "Comic Sans MS", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f151a; --card:#161e25; --ink:#e6edf1; --muted:#9aa9b4; --line:#2a353e;
  --pen:#93a3ff; --pen-ink:#0f151a; --pen-soft:#1f2650;
  --ok:#62d39c; --ok-soft:#12301f; --bad:#ff8b7c; --bad-soft:#3a1814;
  --marker:#f0cc00; --marker-op:.55;
  --water:#142a3b; --grat:#23435a; --border:#c3ccd3; --coast:#7fa3bd;
  --c0:#4a4330; --c1:#33452f; --c2:#4b3531; --c3:#2f3d52; --c4:#40354b; --c5:#45432c;
  --nb:#262d2d; --de:#4a4630; --state:#b5ac8c;
  --river:#6cb2f5; --mt:#9b7656; --mt-edge:#e0b68e; --city:#f2f4f5; --halo:#161e25; --clbl:#b8c4cc;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f151a; --card:#161e25; --ink:#e6edf1; --muted:#9aa9b4; --line:#2a353e;
  --pen:#93a3ff; --pen-ink:#0f151a; --pen-soft:#1f2650;
  --ok:#62d39c; --ok-soft:#12301f; --bad:#ff8b7c; --bad-soft:#3a1814;
  --marker:#f0cc00; --marker-op:.55;
  --water:#142a3b; --grat:#23435a; --border:#c3ccd3; --coast:#7fa3bd;
  --c0:#4a4330; --c1:#33452f; --c2:#4b3531; --c3:#2f3d52; --c4:#40354b; --c5:#45432c;
  --nb:#262d2d; --de:#4a4630; --state:#b5ac8c;
  --river:#6cb2f5; --mt:#9b7656; --mt-edge:#e0b68e; --city:#f2f4f5; --halo:#161e25; --clbl:#b8c4cc;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.head{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.head h1{font-size:clamp(30px,7vw,44px);font-weight:800;letter-spacing:-.01em}
.head h1 span{color:var(--pen)}
.head p{margin:0;color:var(--muted);max-width:60ch}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.status.ok i{background:var(--ok)} .status.warn i{background:var(--bad)}
.hero{background:var(--pen);color:var(--pen-ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero h2{font-size:24px}
.hero p{margin:0;opacity:.92;max-width:54ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--pen);color:var(--pen-ink);min-height:46px}
.btn.inv{background:var(--pen-ink);color:var(--pen)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost.oninv{color:var(--pen-ink);border-color:color-mix(in srgb,var(--pen-ink) 50%,transparent)}
.btn.small{min-height:36px;padding:7px 12px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:18px}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.tile:hover{border-color:var(--pen)}
.tile b{font-weight:600;font-size:16px}
.tile small{color:var(--muted);font-size:13px}
.tile .q{font-family:var(--f-hand);color:var(--pen);font-size:15px;line-height:1.2}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0}
.tile .best{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qbar{display:flex;align-items:center;gap:12px}
.qbar .prog{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.qbar .prog span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qbar .x{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pen);transition:width .3s}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:480px){.card{padding:14px}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--pen-soft);color:var(--pen);font-weight:500}
.prompt{font-size:20px;font-weight:500;line-height:1.35;margin:0}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:520px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);min-height:50px}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--pen-soft);color:var(--pen)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.inrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.inrow input,.inrow textarea{flex:1 1 220px;min-width:0;font:inherit;font-size:17px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inrow textarea{flex-basis:100%;min-height:110px;resize:vertical;line-height:1.45}
.inrow .right{border-color:var(--ok);background:var(--ok-soft)}
.inrow .wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb .verdict{font-family:var(--f-hand);font-size:24px;font-weight:700;line-height:1.1}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb p{margin:0;max-width:62ch}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.keys li{display:flex;gap:8px;align-items:baseline;font-size:15px}
.keys li b{flex:none;width:18px;font-family:var(--f-hand);font-size:18px}
.keys li.hit b{color:var(--ok)} .keys li.miss b{color:var(--bad)}
.model{border-left:3px solid var(--pen);padding:6px 12px;background:var(--card);border-radius:0 8px 8px 0}
.model span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--pen);text-decoration:underline;font-size:14px}
.mapbox{display:flex;flex-direction:column;gap:6px;min-width:0}
.mapwrap{overflow:auto;border-radius:10px;border:1.5px solid var(--line);background:var(--water);-webkit-overflow-scrolling:touch}
.mapwrap svg.map{display:block;width:100%;height:auto;touch-action:manipulation}
.mapwrap.zoom svg.map{width:230%}
.maptools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.maptools button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px}
.clickable{cursor:crosshair}
.mapload{padding:60px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--card)}
svg .sea{fill:var(--water)}
svg .grat{fill:none;stroke:var(--grat);stroke-width:.6px;vector-effect:non-scaling-stroke}
svg .land{stroke:var(--border);stroke-width:.9px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg .c0{fill:var(--c0)} svg .c1{fill:var(--c1)} svg .c2{fill:var(--c2)} svg .c3{fill:var(--c3)} svg .c4{fill:var(--c4)} svg .c5{fill:var(--c5)}
svg .nb{fill:var(--nb)}
svg .de{fill:var(--de);stroke-width:1.8px}
svg .state{fill:none;stroke:var(--state);stroke-width:.8px;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
svg .clbl{font-family:var(--f-body);font-weight:500;fill:var(--clbl);letter-spacing:.08em;text-transform:uppercase;paint-order:stroke;stroke:var(--halo);stroke-width:2.5px;stroke-opacity:.6;pointer-events:none}
svg .wlbl{font-family:var(--f-body);font-style:italic;fill:var(--river);paint-order:stroke;stroke:var(--halo);stroke-width:2.5px;stroke-opacity:.5;pointer-events:none}
svg .riv{fill:none;stroke:var(--river);stroke-width:1.5px;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
svg .riv.hl{stroke-width:3px}
svg .mk{fill:none;stroke:var(--marker);stroke-opacity:var(--marker-op);stroke-linecap:round;stroke-linejoin:round}
svg .mte{fill:none;stroke:var(--mt-edge);stroke-dasharray:4 3;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
svg .mtf{fill:none;stroke:var(--mt);stroke-linecap:round;stroke-linejoin:round;opacity:.8}
svg .cty{fill:var(--city)}
svg .cty-sq{fill:var(--card);stroke:var(--city);stroke-width:1.3}
svg .ring{fill:var(--marker);fill-opacity:var(--marker-op);stroke:var(--city);stroke-width:1.3}
svg .lbl{font-family:var(--f-body);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
svg .lbl.good{fill:var(--ok)}
svg .gridl{stroke:var(--pen);stroke-width:1px;stroke-opacity:.55;fill:none;vector-effect:non-scaling-stroke}
svg .gridt{font-family:var(--f-body);font-weight:600;fill:var(--pen)}
svg .dist{stroke:var(--pen);stroke-width:2.5px;vector-effect:non-scaling-stroke}
svg .tick{stroke:var(--pen);stroke-width:2px;vector-effect:non-scaling-stroke}
svg .bar-a{fill:var(--city)} svg .bar-b{fill:var(--card);stroke:var(--city);stroke-width:1}
svg .barbg{fill:var(--card);fill-opacity:.92;stroke:var(--line)}
svg .bart{font-family:var(--f-body);fill:var(--ink);font-variant-numeric:tabular-nums}
svg .star{fill:var(--marker);stroke:var(--city);stroke-width:1.3}
svg .pin{fill:var(--pen);stroke:var(--halo);stroke-width:1.5}
svg .pin.bad{fill:var(--bad)}
svg .goodring{fill:none;stroke:var(--ok);stroke-width:3px;vector-effect:non-scaling-stroke}
svg .gline{fill:none;stroke:var(--marker);stroke-opacity:.9;stroke-width:8px;vector-effect:non-scaling-stroke}
svg .gline-c{fill:none;stroke:var(--city);stroke-width:1.3px;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
svg .narrow{fill:var(--ink)}
svg .vis-bg{fill:var(--card)}
svg .vis-t{font-family:var(--f-body);fill:var(--ink)}
svg .sky{fill:#121a33} svg .st{fill:#f2f4ff} svg .stl{font-family:var(--f-body);font-weight:600;fill:#ffd60a;font-size:20px}
svg .cline{fill:none;stroke:#8fa3ff;stroke-width:1.2;opacity:.75}
svg .hline{fill:none;stroke:#ffd60a;stroke-width:2;stroke-dasharray:6 5}
svg .cont{fill:none;stroke:var(--mt-edge);stroke-width:1.6}
@media (prefers-reduced-motion:no-preference){ svg .pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center} @keyframes pulse{50%{transform:scale(1.35);opacity:.55}} }
.big{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted);font-weight:600}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rlist li{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.rlist li .m{font-family:var(--f-hand);font-size:22px;font-weight:700;line-height:1}
.rlist li.r .m{color:var(--ok)} .rlist li.w .m{color:var(--bad)}
.rlist li div{min-width:0}
.rlist li p{margin:0;font-size:14px;overflow-wrap:anywhere}
.foot{font-size:12px;color:var(--muted);max-width:70ch}
</style>

</head>

function decodeEcharts(json){if(!json||!json.features)return null;if(!json.UTF8Encoding)return json;const sc=json.UTF8Scale==null?1024:json.UTF8Scale;

/* jsVectorMap liefert SVG-Pfade in Miller-Projektion; zurückrechnen in Längen/Breiten */
function svgRings(d){const t=d.match(/[MmLlHhVvZzCcSsQqTtAa]|-?\d*\.?\d+(?:e[-+]?\d+)?/g)||[];const rings=[];let r=null,x=0,y=0,sx=0,sy=0,cmd="",i=0;
 const num=()=>parseFloat(t[i++]);
 while(i<t.length){if(/[a-z]/i.test(t[i]))cmd=t[i++];
  switch(cmd){
   case"M":x=num();y=num();r=[[x,y]];rings.push(r);sx=x;sy=y;cmd="L";break;
   case"m":x+=num();y+=num();r=[[x,y]];rings.push(r);sx=x;sy=y;cmd="l";break;
   case"L":x=num();y=num();r.push([x,y]);break; case"l":x+=num();y+=num();r.push([x,y]);break;
   case"H":x=num();r.push([x,y]);break; case"h":x+=num();r.push([x,y]);break;
   case"V":y=num();r.push([x,y]);break; case"v":y+=num();r.push([x,y]);break;
   case"C":i+=4;x=num();y=num();r.push([x,y]);break; case"c":i+=4;x+=num();y+=num();r.push([x,y]);break;
   case"S":case"Q":i+=2;x=num();y=num();r.push([x,y]);break; case"s":case"q":i+=2;x+=num();y+=num();r.push([x,y]);break;
   case"T":x=num();y=num();r.push([x,y]);break; case"t":x+=num();y+=num();r.push([x,y]);break;
   case"A":i+=5;x=num();y=num();r.push([x,y]);break; case"a":i+=5;x+=num();y+=num();r.push([x,y]);break;
   case"Z":case"z":if(r){r.push([sx,sy]);}x=sx;y=sy;cmd="";break;
   default:i++;}}

function jvmToGeo(m){const R=6381372,rd=Math.PI/180;const c=(m.projection&&m.projection.centralMeridian)||0;const type=(m.projection&&m.projection.type)||"mill";const ins=(m.insets||[])[0];if(!ins)return null;
 const b=ins.bbox;const fx=(b[1].x-b[0].x)/ins.width,fy=(b[1].y-b[0].y)/ins.height;
 const inv=(sx,sy)=>{const X=b[0].x+(sx-ins.left)*fx,Y=b[0].y+(sy-ins.top)*fy;const lon=c+X/R/rd;let lat;
  if(type==="merc")lat=(2*Math.atan(Math.exp(-Y/R))-Math.PI/2)/rd;else lat=((Math.atan(Math.exp(-0.8*Y/R))-Math.PI/4)/0.4)/rd;return[lon,lat];};
 const features=Object.entries(m.paths||{}).map(([id,p])=>({type:"Feature",properties:{id,name:p.name},geometry:{type:"MultiPolygon",coordinates:svgRings(p.path).map(r=>[r.map(q=>inv(q[0],q[1]))])}}));

function buildProjections(){
 const sph={type:"Sphere"};
 for(const name of Object.keys(MAPDEF)){
  const md=MAPDEF[name];let P;
  if(name==="world")P=d3.geoNaturalEarth1().fitExtent([[4,4],[md.W-4,md.H-4]],sph);
  else if(name==="europe")P=d3.geoConicConformal().rotate([-20,0]).parallels([40,62]).fitExtent([[0,0],[md.W,md.H]],{type:"MultiPoint",coordinates:[[-10.5,36],[-10.5,58],[0,60.5],[22,71],[56,66],[58,50],[45,35.5],[20,34.5],[-9,35.5]]}).clipExtent([[0,0],[md.W,md.H]]);
  else P=d3.geoConicConformal().rotate([-10.4,0]).parallels([48,54]).fitExtent([[md.grid.x0,md.grid.y0],[md.grid.x1,md.grid.y1]],{type:"MultiPoint",coordinates:[[5.7,47.2],[15.3,47.2],[5.7,55.15],[15.3,55.15]]}).clipExtent([[0,0],[md.W,md.H]]);
  md.P=P;const path=d3.geoPath(P).digits(1);md.path=path;
  const proj=(la,lo)=>P([lo,la]);
  md.cityPx={};md.cities.forEach(c=>{md.cityPx[c.n]=proj(c.la,c.lo);});
  md.riverD={};md.riverPx={};md.rivers.forEach(r=>{const ls={type:"LineString",coordinates:RIVERS[r].map(p=>[p[1],p[0]])};md.riverD[r]=path(ls);md.riverPx[r]=RIVERS[r].map(p=>proj(p[0],p[1])).filter(Boolean);});
  md.mountD={};md.mountPx={};md.mounts.forEach(m=>{const ls={type:"LineString",coordinates:MOUNTS[m].map(p=>[p[1],p[0]])};md.mountD[m]=path(ls);md.mountPx[m]=MOUNTS[m].map(p=>proj(p[0],p[1])).filter(Boolean);});
  md.ptPx={};Object.entries(POINTS[name]).forEach(([k,v])=>{md.ptPx[k]=proj(v[0],v[1]);});
  const inView=p=>p&&p[0]>8&&p[0]<md.W-8&&p[1]>8&&p[1]<md.H-8;
  md.clbl=CLABELS[name].map(([n,la,lo])=>{const p=proj(la,lo);return inView(p)?`<text class="clbl" x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" font-size="${md.cfs}" text-anchor="middle">${esc(n)}</text>`:"";}).join("");
  md.wlbl=WATERLABELS[name].map(([n,la,lo])=>{const p=proj(la,lo);return inView(p)?`<text class="wlbl" x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" font-size="${md.cfs+1}" text-anchor="middle">${esc(n)}</text>`:"";}).join("");
 }
}
const isDE=f=>f.properties&&(f.properties.id==="DE"||f.properties.name==="Germany"||f.properties.name==="Deutschland");
function colorize(feats,path){/* Nachbarländer bekommen möglichst verschiedene Farben */
 const items=feats.map(f=>{let b=null;try{b=path.bounds(f);}catch(e){}return{f,b,c:-1,a:b&&isFinite(b[0][0])?(b[1][0]-b[0][0])*(b[1][1]-b[0][1]):0};}).filter(x=>x.b&&isFinite(x.b[0][0]));
 items.sort((p,q)=>q.a-p.a);
 const touch=(p,q)=>p.b[0][0]<=q.b[1][0]+1&&q.b[0][0]<=p.b[1][0]+1&&p.b[0][1]<=q.b[1][1]+1&&q.b[0][1]<=p.b[1][1]+1;
 items.forEach((it,i)=>{const used=new Array(6).fill(0);for(let j=0;j<i;j++)if(touch(it,items[j]))used[items[j].c]++;let c=used.indexOf(0);if(c<0)c=used.indexOf(Math.min.apply(null,used));it.c=c;});

function buildBase(){
 const sph={type:"Sphere"};
 for(const name of Object.keys(MAPDEF)){
  const md=MAPDEF[name],path=md.path;
  let g= name==="world"?`<path class="sea" d="${path(sph)}"/>`:`<rect class="sea" width="${md.W}" height="${md.H}"/>`;
  g+=`<path class="grat" d="${path(d3.geoGraticule().step(name==="germany"?[2,2]:name==="europe"?[10,10]:[20,20])())}"/>`;
  let feats=[];
  if(name==="world"){if(GEO.world)feats=GEO.world.features;else if(GEO.europe)feats=GEO.europe.features;}
  else{const eu=GEO.europe,wl=GEO.world;
   if(eu&&wl){const ids=new Set(eu.features.map(f=>f.properties&&f.properties.id));feats=wl.features.filter(f=>!ids.has(f.properties&&f.properties.id)).concat(eu.features);}
   else feats=(eu||wl||{features:[]}).features;}
  const pd=f=>{try{return path(f)||"";}catch(e){return"";}};
  if(name==="germany"){feats.forEach(f=>{const d=pd(f);if(d)g+=`<path class="land ${isDE(f)?"de":"nb"}" d="${d}"/>`;});
   if(GEO.states)GEO.states.features.forEach(f=>{const d=pd(f);if(d)g+=`<path class="state" d="${d}"/>`;});}
  else colorize(feats,path).forEach(it=>{const d=pd(it.f);if(d)g+=`<path class="land c${it.c}" d="${d}"/>`;});
  md.base=g;

}

function dSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy));}
function dLine(p,pts){if(pts.length===1)return Math.hypot(p[0]-pts[0][0],p[1]-pts[0][1]);let m=Infinity;for(let i=1;i<pts.length;i++)m=Math.min(m,dSeg(p,pts[i-1],pts[i]));return m;}
const midOf=pts=>pts[Math.floor(pts.length/2)];

function starPath(x,y,r){let d="";for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;d+=(i?"L":"M")+(x+rr*Math.cos(a)).toFixed(1)+","+(y+rr*Math.sin(a)).toFixed(1);}return `<path class="star pulse" d="${d}Z"/>`;}

  for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4,L=i%2?78:112,x=140+L*Math.cos(a),y=140+L*Math.sin(a);const px=140+16*Math.cos(a+Math.PI/2),py=140+16*Math.sin(a+Math.PI/2),qx=140+16*Math.cos(a-Math.PI/2),qy=140+16*Math.sin(a-Math.PI/2);
   s+=`<path d="M${px},${py}L${x},${y}L${qx},${qy}Z" style="fill:${i%2?"var(--line)":"var(--muted)"};stroke:var(--ink);stroke-width:1"/>`;
   const tx=140+(L+18)*Math.cos(a),ty=140+(L+18)*Math.sin(a)+7;s+=`<text class="vis-t" x="${tx}" y="${ty}" text-anchor="middle" font-size="20" font-weight="700" ${i===0?"":'style="fill:var(--pen)"'}>${v.letters[i]}</text>`;}
  return s+`<circle cx="140" cy="140" r="7" style="fill:var(--card);stroke:var(--ink)"/></svg>`;}
 if(v.type==="stars"){const S={dubhe:[288,214],merak:[300,242],phecda:[342,252],megrez:[346,222],alioth:[374,210],mizar:[398,204],alkaid:[424,214],polaris:[230,86],yildun:[212,100],eps:[198,121],zeta:[192,146],eta:[168,154],kochab:[158,128],pherkad:[176,122]};
  let s=`<svg viewBox="0 0 460 300" class="map" role="img" aria-label="Sternenhimmel mit Großem und Kleinem Wagen"><rect class="sky" width="460" height="300"/>`;
  [[60,40],[110,250],[400,60],[30,170],[260,30],[440,150],[80,120],[350,120],[130,200]].forEach(p=>s+=`<circle class="st" cx="${p[0]}" cy="${p[1]}" r="1.4" opacity=".6"/>`);
  const ln=a=>"M"+a.map(k=>S[k].join(",")).join("L");
  s+=`<path class="cline" d="${ln(["dubhe","merak","phecda","megrez","dubhe","megrez","alioth","mizar","alkaid"])}"/><path class="cline" d="${ln(["polaris","yildun","eps","zeta","eta","kochab","pherkad","zeta"])}"/>`;
  if(v.reveal)s+=`<path class="hline" d="M${S.merak.join(",")}L${S.polaris.join(",")}"/>`;
  Object.entries(S).forEach(([k,p])=>{const r=["polaris","dubhe","alkaid","kochab","merak"].indexOf(k)>=0?3.4:2.6;s+=`<circle class="st" cx="${p[0]}" cy="${p[1]}" r="${r}"/>`;});
  v.cands.forEach((k,i)=>{const p=S[k];s+=`<text class="stl" x="${p[0]+8}" y="${p[1]-8}">${"ABCD"[i]}</text>`;});
  return s+`<text x="330" y="285" font-size="13" fill="#c9d1ff" font-family="Lexend,sans-serif">Großer Wagen</text></svg>`;}
 if(v.type==="contour"){const cx=210,cy=165,phi=v.phi*Math.PI/2-Math.PI/2;const sp=t=>19-11*Math.cos(t-phi);
  let s=`<svg viewBox="0 0 420 330" class="map" role="img" aria-label="Höhenlinienkarte eines Berges"><rect class="vis-bg" width="420" height="330"/>`;
  for(let k=1;k<=5;k++){let d="";for(let i=0;i<=72;i++){const t=i/72*2*Math.PI,r=(6-k)*sp(t)*.95+(k===5?2:0);d+=(i?"L":"M")+(cx+r*Math.cos(t)).toFixed(1)+","+(cy+r*Math.sin(t)).toFixed(1);}
   s+=`<path class="cont" d="${d}Z"/>`;const t=phi+Math.PI+0.35,r=(6-k)*sp(t)*.95;s+=`<text class="lbl" x="${cx+r*Math.cos(t)}" y="${cy+r*Math.sin(t)+5}" font-size="13" text-anchor="middle">${k*100}</text>`;}
  s+=`<path d="M${cx},${cy-9}L${cx+8},${cy+5}L${cx-8},${cy+5}Z" style="fill:var(--ink)"/><text class="lbl" x="${cx+12}" y="${cy-6}" font-size="14">${v.peak} m</text>`;
  v.pts.forEach(pt=>{const t=phi+pt.side*Math.PI/2,r=(6-pt.ring-.5)*sp(t)*.95;const x=cx+r*Math.cos(t),y=cy+r*Math.sin(t);s+=`<circle cx="${x}" cy="${y}" r="5" style="fill:var(--pen)"/><text class="lbl" x="${x+8}" y="${y-8}" font-size="18" style="fill:var(--pen)">${pt.l}</text>`;});
  return s+`</svg>`;}
 return "";
}

function distQs(set,n){if(!GEO.d3)return [];const md=MAPDEF[set],out=[];const barKm=set==="germany"?100:500;const range=set==="germany"?[150,620]:[500,2600];

  const pa=md.cityPx[a.n],pb=md.cityPx[b.n];if(!pa||!pb)continue;const lp=Math.hypot(pa[0]-pb[0],pa[1]-pb[1]);const barPx=barKm*lp/km;if(barPx<36||barPx>md.W*0.45||lp<barPx*1.2)continue;
  const step=set==="germany"?10:50;const r=x=>Math.round(x/step)*step;const real=r(km);
  const opts=[real];[0.5,1.6,2.2,0.7,1.35].forEach(f=>{const v=r(km*f);if(opts.every(o=>Math.abs(o-v)>step*1.5)&&opts.length<4)opts.push(v);});
  const times=(lp/barPx).toFixed(1).replace(".",",");
  out.push(mc("mess",`Wie weit sind ${a.n} und ${b.n} ungefähr voneinander entfernt (Luftlinie)? Nutze den Messbalken.`,opts.map(v=>fmt(v)+" km"),fmt(real)+" km",

 return out;}
function bearing(a,b){const t=Math.PI/180,f1=a.la*t,f2=b.la*t,dl=(b.lo-a.lo)*t;const x=Math.atan2(Math.sin(dl)*Math.cos(f2),Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl))/t;return (x+360)%360;}

  const dx=pb[0]-pa[0],dy=pb[1]-pa[1];if(Math.hypot(dx,dy)<80)continue;let ang=Math.atan2(dx,-dy)*180/Math.PI;if(ang<0)ang+=360;
  const sec=x=>Math.floor(((x+22.5)%360)/45),off=x=>(x+22.5)%45;const br=bearing(a,b);

 return L.map(([n,keys,model])=>Object.assign(O("de",`Beschreibe die Lage von ${n}. Nutze die Karte (Himmelsrichtung, Fluss, Bundesland oder Nachbarstädte).`,keys,2,model),{map:{name:"germany",rivers:true,mounts:true,cities:true,hl:{t:"city",id:n,label:true}}}));}

const TOPICS=[
 {id:"orient",name:"Orientierung & Himmelsrichtungen",sub:"Sonne, Kompass, Windrose, Lage beschreiben",pool:()=>BANK.orient.concat(compassQs(3),dirQs("europe",4),dirQs("germany",3))},
 {id:"nord",name:"Nordstern",sub:"Polarstern finden und nutzen",flag:true,pool:()=>BANK.nord.concat(starQs(3))},
 {id:"luft",name:"Luftbilder & Karten",sub:"Senkrecht- und Schrägluftbild, Karte: Vor- und Nachteile",pool:()=>BANK.luft},
 {id:"mass",name:"Maßstab",sub:"Was die Zahlen bedeuten, großer und kleiner Maßstab",flag:true,pool:()=>BANK.mass},
 {id:"mess",name:"Messbalken & Entfernung",sub:"Entfernungen auf Karten bestimmen",pool:()=>BANK.mess.concat(distQs("europe",4),distQs("germany",4))},
 {id:"atlas",name:"Orte im Atlas finden",sub:"Register, Seite, Planquadrat, Kartenarten",pool:()=>BANK.atlas.concat(gridQs(8))},
 {id:"hoehe",name:"Höhen & Berge",sub:"Höhenlinien, Farben, höchste Berge",pool:()=>BANK.hoehe.concat(contourQs(4))},
 {id:"welt",name:"Städte der Welt",sub:"Arbeitsblatt Erde – Ballungsräume",pool:()=>cityQs("welt","world")},
 {id:"europa",name:"Städte Europas",sub:"Arbeitsblatt Europa – Ballungsräume",pool:()=>cityQs("europa","europe").concat(megaQs())},
 {id:"de",name:"Deutschland physisch",sub:"Mittelgebirge, Flüsse, Städte, Lage beschreiben",pool:()=>riverQs("de","germany").concat(mountQs("de","germany"),cityQs("de","germany").filter((_,i)=>i%3!==1),pointQs("de","germany"),lageQs())},
 {id:"phys",name:"Gebirge & Flüsse: Welt und Europa",sub:"Arbeitsblätter Erde und Europa – physische Übersicht",pool:()=>riverQs("phys","world").concat(mountQs("phys","world"),riverQs("phys","europe"),mountQs("phys","europe"),pointQs("phys","europe"))},
 {id:"grad",name:"Gradnetz, Kontinente & Ozeane",sub:"Äquator, Wendekreise, Polarkreise",pool:()=>BANK.grad.concat(gradLineQs(),pointQs("grad","world","Kontinent"),pointQs("grad","world","Ozean"))}
];

/* ---------- Quiz-Ablauf ---------- */
const app=$("#app");let ST=null;
const usable=q=>!(q.map&&!GEO.d3);
function sampleTopic(t,n){const pool=t.pool().filter(usable);const by={};pool.forEach(q=>{(by[q.k]=by[q.k]||[]).push(q);});
 const kinds=Object.keys(by);const sh={};kinds.forEach(k=>sh[k]=shuffle(by[k]));const out=[];let i=0;
 while(out.length<n&&kinds.some(k=>sh[k].length)){const k=kinds[i%kinds.length];if(sh[k].length)out.push(sh[k].pop());i++;}
 return shuffle(out);}
function startTopic(id){const t=TOPICS.find(x=>x.id===id);begin(t.name,id,sampleTopic(t,10));}
function startExam(){let qs=[];TOPICS.forEach(t=>{qs=qs.concat(sampleTopic(t,t.flag?2:1));});
 shuffle(["welt","europa","de","phys","mess","luft"]).forEach(id=>{const q=sampleTopic(TOPICS.find(x=>x.id===id),1)[0];if(q)qs.push(q);});
 begin("Probe-Klassenarbeit","exam",shuffle(qs).slice(0,20));}
function startWrong(){const s=store.get();const list=(s.wrong||[]).slice(-15);if(list.length)begin("Fehler üben","wrong",shuffle(list));}
function begin(title,id,qs){ST={title,id,qs,i:0,score:0,log:[]};renderQ();window.scrollTo(0,0);}

function renderHome(){
 const s=store.get();const best=s.best||{};const nw=(s.wrong||[]).length;
 app.innerHTML=`
 <header class="head"><span class="eyebrow">Erdkunde · Klasse 5 · Orientierung im Atlas</span><h1>Atlas-<span>Check</span></h1>
  <p>Üben für die Klassenarbeit: Karten, Himmelsrichtungen, Maßstab, Höhen. Mit Karten zum Antippen, Auswahlfragen und Fragen, bei denen du in eigenen Worten antwortest.</p>
  <div class="status" id="status"><i></i><span>Karten werden geladen …</span></div></header>
 <section class="hero"><h2>Probe-Klassenarbeit</h2><p>20 gemischte Fragen aus allen Themen. Nordstern und Maßstab kommen öfter dran, weil du sie auf deinem Zettel mit „?“ markiert hast.</p>
  <div class="row"><button class="btn inv" id="exam">Probe-Klassenarbeit starten</button>${nw?`<button class="btn ghost oninv" id="wrong">Fehler üben (${nw})</button>`:""}</div></section>
 <section class="sec"><h3>Einzelne Themen üben</h3><div class="tiles">
 ${TOPICS.map(t=>{const b=best[t.id];return `<button class="tile" data-t="${t.id}"><b>${esc(t.name)}</b><small>${esc(t.sub)}</small>${t.flag?`<span class="q">? auf deinem Zettel</span>`:""}
   <div class="meter"><i style="width:${b||0}%"></i></div><div class="best"><span>10 Fragen</span><span>${b!=null?"Bestes Ergebnis: "+b+" %":"noch nicht geübt"}</span></div></button>`;}).join("")}
 </div></section>
 <p class="foot">Ländergrenzen: Natural-Earth-basierte Kartendaten, beim Öffnen geladen. Flüsse und Gebirge sind vereinfacht eingezeichnet, ähnlich wie auf den Arbeitsblättern. In der Klassenarbeit arbeitest du mit dem Atlas: Seitenzahlen und Planquadrate sind dort anders als hier.</p>`;
 $("#exam").onclick=startExam;if(nw)$("#wrong").onclick=startWrong;
 app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>startTopic(b.dataset.t));
 const upd=()=>{const el=$("#status");if(!el)return;const ok=!!(GEO.world||GEO.europe);el.className="status "+(ok?"ok":"warn");el.lastChild.textContent=ok?`Karten mit Ländergrenzen bereit${GEO.states?" (mit Bundesländern)":""}`:GEO.note||"Karten nicht verfügbar";};
 MAPREADY.then(upd);
}

const KINDNAME={mc:"Auswahl",text:"Begriff",open:"Eigene Worte",click:"Auf Karte tippen",grid:"Planquadrat"};
function renderQ(){
 const q=ST.qs[ST.i];const n=ST.qs.length;ST.done=false;ST.pin=null;
 app.innerHTML=`<div class="qbar"><button class="x" id="quit">✕ Beenden</button><div class="prog"><span>${esc(ST.title)} · Frage ${ST.i+1} von ${n} · ${ST.score} richtig</span><div class="pbar"><i style="width:${ST.i/n*100}%"></i></div></div></div>
 <article class="card"><div class="chips"><span class="chip">${esc((TOPICS.find(t=>t.id===q.topic)||{}).name||"")}</span><span class="chip">${KINDNAME[q.k]||""}</span></div>
 <p class="prompt">${esc(q.p)}</p><div id="vis"></div><div id="ans"></div><div id="fb"></div></article>`;
 $("#quit").onclick=renderHome;
 if(q.vis)$("#vis").innerHTML=`<div class="mapbox"><div class="mapwrap">${visualSVG(q.vis)}</div></div>`;
 if(q.map)drawMapInto($("#vis"),q);
 const A=$("#ans");
 if(q.k==="mc"){A.innerHTML=`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>checkMC(+b.dataset.i));}
 else if(q.k==="text"||q.k==="grid"){A.innerHTML=`<form class="inrow" id="f"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.k==="grid"?"z. B. C4":"Antwort eingeben"}" aria-label="Antwort"><button class="btn" id="go">Prüfen</button></form>`;
  $("#f").onsubmit=e=>{e.preventDefault();const v=$("#inp").value.trim();if(v)checkInput(v);};}
 else if(q.k==="open"){A.innerHTML=`<form class="inrow" id="f"><textarea id="inp" placeholder="Antworte in ganzen Sätzen, so wie in der Klassenarbeit." aria-label="Deine Antwort"></textarea><button class="btn" id="go">Antwort prüfen</button></form>`;
  $("#f").onsubmit=e=>{e.preventDefault();const v=$("#inp").value.trim();if(v.length>=3)checkOpen(v);};}
 else if(q.k==="click"){A.innerHTML=`<div class="row"><button class="btn" id="go" disabled>Prüfen</button><span class="hint" id="clickhint">Tippe zuerst auf die Karte.</span></div>`;$("#go").onclick=checkClick;}
}
async function drawMapInto(host,q){
 host.innerHTML=`<div class="mapbox"><div class="mapwrap"><div class="mapload">Karte wird geladen …</div></div></div>`;
 await MAPREADY;if(!ST||ST.qs[ST.i]!==q)return;
 const m=q.map;const md=MAPDEF[m.name];const mm=Object.assign({},m,{cities:m.cities||(m.click&&m.click.t==="city")});
 const warn=(GEO.world||GEO.europe)?"":`<span style="color:var(--bad)">Ländergrenzen nicht geladen</span>`;
 host.innerHTML=`<div class="mapbox"><div class="mapwrap">${mapSVG(mm)}</div><div class="maptools"><span>Karte: ${md.title}${(m.rivers||m.mounts)?" · Flüsse und Gebirge vereinfacht":""} ${warn}</span><button type="button" id="zoom">Karte vergrößern</button></div></div>`;
 const wrap=host.querySelector(".mapwrap");$("#zoom").onclick=e=>{wrap.classList.toggle("zoom");e.target.textContent=wrap.classList.contains("zoom")?"Karte verkleinern":"Karte vergrößern";};
 if(m.click){const svg=host.querySelector("svg");svg.addEventListener("click",e=>{if(ST.done)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());ST.pin=[p.x,p.y];
  svg.querySelector(".pins").innerHTML=pinSVG(p.x,p.y,"",md.W/560);$("#go").disabled=false;const h=$("#clickhint");if(h)h.textContent="Du kannst noch einmal tippen, um den Punkt zu ändern.";});}
}

function saveWrong(q,ok){const s=store.get();s.wrong=s.wrong||[];const key=w=>JSON.stringify([w.p,w.map&&w.map.hl,w.map&&w.map.click,w.vis,w.map&&w.map.dist,w.map&&w.map.dir]);const k=key(q);
 s.wrong=s.wrong.filter(w=>key(w)!==k);if(!ok)s.wrong.push(q);s.wrong=s.wrong.slice(-40);store.set(s);}
function finish(ok,userTxt,corrTxt,note,extra){
 const q=ST.qs[ST.i];ST.done=true;if(ok)ST.score++;const entry={q,ok,user:userTxt,corr:corrTxt};ST.log.push(entry);saveWrong(q,ok);
 revealMap(q);
 if(q.visReveal){const w=$("#vis .mapwrap");if(w)w.innerHTML=visualSVG(Object.assign({},q.vis,{reveal:true}));}
 const last=ST.i===ST.qs.length-1;
 $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><span class="verdict">${ok?"Richtig!":(q.k==="open"?"Noch nicht vollständig":"Leider falsch")}</span>
  ${!ok&&corrTxt?`<p>Richtig ist: <b>${esc(corrTxt)}</b></p>`:""}${note?`<p>${esc(note)}</p>`:""}${extra||""}${q.x?`<p>${esc(q.x)}</p>`:""}
  <div class="row" style="margin-top:4px"><button class="btn" id="next">${last?"Ergebnis ansehen":"Weiter"}</button>${!ok&&q.k==="open"?`<button class="linkbtn" id="override">Meine Antwort meint dasselbe – als richtig werten</button>`:""}</div></div>`;
 const nb=$("#next");nb.onclick=()=>{if(last)renderResult();else{ST.i++;renderQ();window.scrollTo(0,0);}};nb.focus({preventScroll:true});
 const ov=$("#override");if(ov)ov.onclick=()=>{entry.ok=true;ST.score++;saveWrong(q,true);const fb=$("#fb .fb");fb.className="fb ok";fb.querySelector(".verdict").textContent="Als richtig gewertet";ov.remove();};
 $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function checkMC(i){if(ST.done)return;const q=ST.qs[ST.i];const ok=i===q.a;
 $("#ans").querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("right");else if(j===i)b.classList.add("wrong");});
 finish(ok,q.o[i],q.o[q.a]);}
function checkInput(v){if(ST.done)return;const q=ST.qs[ST.i];let ok=false,note=null,corr=q.show;
 if(q.k==="grid"){const c=canon(v).toUpperCase();const m=c.match(/^([A-H])(\d)$/)||c.match(/^(\d)([A-H])$/);const cell=m?(isNaN(m[1])?m[1]+m[2]:m[2]+m[1]):"";ok=cell===q.ans;}
 else{const cv=canon(v);const accs=q.acc.map(canon);if(accs.indexOf(cv)>=0)ok=true;else{const d=Math.min.apply(null,accs.map(a=>lev(cv,a)));const lim=cv.length>=8?2:cv.length>=4?1:0;if(d<=lim){ok=true;note=`Fast richtig geschrieben. Richtig heißt es: ${q.show}.`;}}}
 const inp=$("#inp");inp.classList.add(ok?"right":"wrong");inp.disabled=true;$("#go").disabled=true;
 finish(ok,v,corr,note);}
function checkOpen(v){if(ST.done)return;const q=ST.qs[ST.i];const cv=canon(v);
 const hits=q.keys.map(k=>k.re?new RegExp(k.re).test(cv):k.a.some(a=>{const ca=canon(a);return ca.length>0&&cv.indexOf(ca)>=0;}));
 const n=hits.filter(Boolean).length;const ok=n>=q.need;
 const inp=$("#inp");inp.classList.add(ok?"right":"wrong");inp.disabled=true;$("#go").disabled=true;
 const need=q.need>=q.keys.length?"alle Punkte":q.need===1?"mindestens einen Punkt":`mindestens ${q.need} Punkte`;
 const extra=`<p>Das gehört in eine gute Antwort (${need}):</p><ul class="keys">${q.keys.map((k,i)=>`<li class="${hits[i]?"hit":"miss"}"><b>${hits[i]?"✓":"○"}</b><span>${esc(k.l)}</span></li>`).join("")}</ul>
  <div class="model"><span>Musterantwort</span>${esc(q.model)}</div>`;
 finish(ok,v,ok?"":"siehe Musterantwort",null,extra);}
function checkClick(){if(ST.done||!ST.pin)return;const q=ST.qs[ST.i];const m=q.map,md=MAPDEF[m.name],p=ST.pin,t=m.click;let ok=false,note=null,best=null,bd=Infinity;
 if(t.t==="city"){md.cities.forEach(c=>{const cp=md.cityPx[c.n];if(!cp)return;const d=Math.hypot(cp[0]-p[0],cp[1]-p[1]);if(d<bd){bd=d;best=c.n;}});ok=best===t.id&&bd<=md.tol;}
 if(t.t==="river"){md.rivers.forEach(r=>{const d=dLine(p,md.riverPx[r]);if(d<bd){bd=d;best=r;}});ok=best===t.id&&bd<=md.tol*.7;}
 if(t.t==="mount"){md.mounts.forEach(r=>{const d=dLine(p,md.mountPx[r]);if(d<bd){bd=d;best=r;}});ok=best===t.id&&bd<=md.mw/2+md.tol*.6;}
 if(!ok&&best&&best!==t.id&&bd<=md.tol)note=`Du hast auf ${best} getippt.`;
 if(t.t==="city"&&!ok){const tgt=findCity(m.name,t.id);const inv=md.P.invert(p);if(inv&&tgt){const km=haversine({la:inv[1],lo:inv[0]},tgt);note=(note?note+" ":"")+`Dein Punkt liegt etwa ${fmt(Math.round(km/10)*10)} km daneben.`;}}
 $("#go").disabled=true;const svg=$("#vis svg");if(svg)svg.querySelector(".pins").innerHTML=pinSVG(p[0],p[1],ok?"":"bad",md.W/560);
 finish(ok,best?("getippt: "+best):"",q.show,note);}
function revealMap(q){const svg=$("#vis svg.map");if(!svg||!q.map)return;const m=q.map,md=MAPDEF[m.name],fs=md.fs;LBLW=md.W;const g=svg.querySelector(".reveal");if(!g)return;let s="";
 const t=(m.click||m.hl)||{};const u=md.W/560;
 if(t.t==="city"){const p=md.cityPx[t.id];s+=`<circle class="goodring" cx="${p[0]}" cy="${p[1]}" r="${9*u}"/>`+(t.label?"":lbl(p,t.id,fs,"good"));}
 if(t.t==="river"){if(m.click)s+=`<path class="mk" d="${md.riverD[t.id]}" stroke-width="${9*u}"/>`;s+=lbl(midOf(md.riverPx[t.id]),t.id,fs,"good");}
 if(t.t==="mount"){if(m.click)s+=`<path class="mk" d="${md.mountD[t.id]}" stroke-width="${md.mw+12}"/>`;s+=lbl(midOf(md.mountPx[t.id]),t.id,fs,"good");}
 if(t.t==="pt"){const p=md.ptPx[t.id];s+=lbl([p[0]+6,p[1]],t.id,fs,"good");}
 if(m.dist){const a=md.cityPx[m.dist.a],b=md.cityPx[m.dist.b];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const ux=(b[0]-a[0])/L,uy=(b[1]-a[1])/L;for(let d=m.dist.barPx;d<L;d+=m.dist.barPx){const x=a[0]+ux*d,y=a[1]+uy*d;s+=`<line class="tick" x1="${x-uy*7}" y1="${y+ux*7}" x2="${x+uy*7}" y2="${y-ux*7}"/>`;}}
 g.innerHTML=s;}

function renderResult(){
 const n=ST.qs.length,sc=ST.log.filter(l=>l.ok).length,pct=Math.round(sc/n*100);const s=store.get();s.best=s.best||{};
 if(TOPICS.some(t=>t.id===ST.id))s.best[ST.id]=Math.max(s.best[ST.id]||0,pct);store.set(s);
 const msg=pct>=90?"Sehr stark. Das sitzt.":pct>=75?"Gut! Schau dir die Fehler unten noch einmal an.":pct>=50?"Ordentlich, aber da geht noch was. Übe die falschen Fragen gleich nochmal.":"Hier lohnt sich Üben. Nimm dir die Themen einzeln vor und wiederhole die Fehler.";
 const wrong=ST.log.filter(l=>!l.ok);
 app.innerHTML=`<header class="head"><span class="eyebrow">${esc(ST.title)}</span><div class="big">${pct} %<small> · ${sc} von ${n} richtig</small></div><p style="font-family:var(--f-hand);font-size:22px;color:var(--pen);margin:0">${esc(msg)}</p></header>
 <div class="row">${wrong.length?`<button class="btn" id="redo">Fehler gleich üben (${wrong.length})</button>`:""}<button class="btn ghost" id="again">Neue Runde</button><button class="btn ghost" id="home">Zur Übersicht</button></div>
 <section class="sec"><h3>Alle Fragen</h3><ol class="rlist">${ST.log.map(l=>`<li class="${l.ok?"r":"w"}"><span class="m">${l.ok?"✓":"✗"}</span><div><p>${esc(l.q.p)}</p>${l.ok?"":`<p class="muted">Deine Antwort: ${esc(l.user||"–")}${l.q.k==="open"?"":" · Richtig: <b>"+esc(l.corr||"")+"</b>"}</p>${l.q.k==="open"?`<p class="muted">Musterantwort: ${esc(l.q.model)}</p>`:""}`}</div></li>`).join("")}</ol></section>`;
 $("#home").onclick=renderHome;
 $("#again").onclick=()=>{if(ST.id==="exam")startExam();else if(ST.id==="wrong")startWrong();else startTopic(ST.id);};
 if(wrong.length)$("#redo").onclick=()=>begin("Fehler üben","wrong",shuffle(wrong.map(l=>l.q)));
 window.scrollTo(0,0);
}
renderHome();
</script>
