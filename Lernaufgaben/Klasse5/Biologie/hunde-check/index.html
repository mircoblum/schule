<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hunde-Check">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Hunde-Check Biologie Klasse 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Kalam:wght@400;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Gleicher Aufbau wie der Atlas-Check (Erdkunde): eine Spalte wie ein Arbeitsblatt, Füller-Blau als Akzent,
   Textmarker-Gelb für Markierungen. Für Biologie: Mappen-Grün im Kopfbereich, Skizzen als Strichzeichnungen. */
:root{
  --paper:#f3f6f6; --card:#ffffff; --ink:#15202b; --muted:#56636e; --line:#d5dde0;
  --pen:#2a3cb4; --pen-ink:#ffffff; --pen-soft:#e5e9fb;
  --hero:#1d6448; --hero-ink:#ffffff;
  --ok:#1b7548; --ok-soft:#dcf0e4; --bad:#b0261d; --bad-soft:#fae3df;
  --marker:#ffd60a; --marker-op:.75;
  --dog:#f7f0e3; --dog2:#e2d6c0; --ear:#c69a6c;
  --bone:#efe5cf; --hole:#d9ccb0; --tooth:#ffffff;
  --t-sch:#f08a24; --t-fang:#2e9e5b; --t-back:#3a74d8; --t-reiss:#8d43b8;
  --leaf:#4f9a3c; --trap:#d9534a; --frog:#7fae5a; --lung:#f2a7a7; --warm:#d8462f; --cold:#2f7fd0;
  --coldbg:#e3f0fb; --warmbg:#fff3cf; --sun:#f6b81a; --womb:#fbe0e0; --milk:#ffffff; --cell:#dff0d2; --cellk:#6a9b4c;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Kalam", "Comic Sans MS", "Bradley Hand", cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f151a; --card:#161e25; --ink:#e6edf1; --muted:#9aa9b4; --line:#2a353e;
  --pen:#93a3ff; --pen-ink:#0f151a; --pen-soft:#1f2650;
  --hero:#86d4ad; --hero-ink:#0f151a;
  --ok:#62d39c; --ok-soft:#12301f; --bad:#ff8b7c; --bad-soft:#3a1814;
  --marker:#f0cc00; --marker-op:.55;
  --dog:#3a372f; --dog2:#2a2823; --ear:#8a6a4a;
  --bone:#4a4438; --hole:#2b271f; --tooth:#f4efe2;
  --t-sch:#ffa24d; --t-fang:#4fcf86; --t-back:#76a6ff; --t-reiss:#c58ae8;
  --leaf:#6fbf5a; --trap:#ff7a70; --frog:#8fc46a; --lung:#d98585; --warm:#ff7a5c; --cold:#6cb2f5;
  --coldbg:#16283a; --warmbg:#3a321a; --sun:#f6c84a; --womb:#4a2a2e; --milk:#f4f4f4; --cell:#24361d; --cellk:#9fd17f;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f151a; --card:#161e25; --ink:#e6edf1; --muted:#9aa9b4; --line:#2a353e;
  --pen:#93a3ff; --pen-ink:#0f151a; --pen-soft:#1f2650;
  --hero:#86d4ad; --hero-ink:#0f151a;
  --ok:#62d39c; --ok-soft:#12301f; --bad:#ff8b7c; --bad-soft:#3a1814;
  --marker:#f0cc00; --marker-op:.55;
  --dog:#3a372f; --dog2:#2a2823; --ear:#8a6a4a;
  --bone:#4a4438; --hole:#2b271f; --tooth:#f4efe2;
  --t-sch:#ffa24d; --t-fang:#4fcf86; --t-back:#76a6ff; --t-reiss:#c58ae8;
  --leaf:#6fbf5a; --trap:#ff7a70; --frog:#8fc46a; --lung:#d98585; --warm:#ff7a5c; --cold:#6cb2f5;
  --coldbg:#16283a; --warmbg:#3a321a; --sun:#f6c84a; --womb:#4a2a2e; --milk:#f4f4f4; --cell:#24361d; --cellk:#9fd17f;
  color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:calc(20px + env(safe-area-inset-top, 0px));padding-bottom:calc(48px + env(safe-area-inset-bottom, 0px))}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.head{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.head h1{font-size:clamp(30px,7vw,44px);font-weight:800;letter-spacing:-.01em}
.head h1 span{color:var(--pen)}
.head p{margin:0;color:var(--muted);max-width:60ch}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero h2{font-size:24px}
.hero p{margin:0;opacity:.92;max-width:54ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--pen);color:var(--pen-ink);min-height:46px}
.btn.inv{background:var(--hero-ink);color:var(--hero)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost.oninv{color:var(--hero-ink);border-color:color-mix(in srgb,var(--hero-ink) 50%,transparent)}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.btn.small{min-height:36px;padding:7px 12px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:18px}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.tile:hover{border-color:var(--pen)}
.tile b{font-weight:600;font-size:16px}
.tile small{color:var(--muted);font-size:13px}
.tile .q{font-family:var(--f-hand);color:var(--pen);font-size:15px;line-height:1.2}
.tile .src{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0}
.tile .best{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.plain{flex-direction:row;align-items:center;gap:12px}
.tile.plain svg{flex:none;width:64px;height:auto}
.tile.plain div{display:flex;flex-direction:column;gap:2px;min-width:0}
.qbar{display:flex;align-items:center;gap:12px}
.qbar .prog{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.qbar .prog span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qbar .x{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;flex:none}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pen);transition:width .3s}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:480px){.card{padding:14px}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--pen-soft);color:var(--pen);font-weight:500}
.prompt{font-size:20px;font-weight:500;line-height:1.35;margin:0}
@media (max-width:480px){.prompt{font-size:18px}}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);min-height:50px}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--pen-soft);color:var(--pen)}
.opt .box{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--pen-ink)}
.opt.on{border-color:var(--pen)} .opt.on .box{background:var(--pen);border-color:var(--pen)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.opt .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;border:2px dashed var(--line);color:var(--muted)}
.opt.on .num{border:0;background:var(--pen);color:var(--pen-ink)}
.inrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.inrow input,.inrow textarea{flex:1 1 220px;min-width:0;font:inherit;font-size:17px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inrow textarea{flex-basis:100%;min-height:110px;resize:vertical;line-height:1.45}
.inrow .right{border-color:var(--ok);background:var(--ok-soft)}
.inrow .wrong{border-color:var(--bad);background:var(--bad-soft)}
.match{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
@media (min-width:560px){.mrow{grid-template-columns:minmax(0,2fr) minmax(0,3fr);align-items:center}}
.mrow>span{font-weight:600}
.mrow select{width:100%;min-height:44px;font-size:16px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.mrow.right{border-color:var(--ok);background:var(--ok-soft)} .mrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mrow .fix{grid-column:1/-1;font-size:14px;color:var(--ok);font-weight:500}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb .verdict{font-family:var(--f-hand);font-size:24px;font-weight:700;line-height:1.1}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb p{margin:0;max-width:62ch}
.fb ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:2px}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.keys li{display:flex;gap:8px;align-items:baseline;font-size:15px}
.keys li b{flex:none;width:18px;font-family:var(--f-hand);font-size:18px}
.keys li.hit b{color:var(--ok)} .keys li.miss b{color:var(--bad)}
.model{border-left:3px solid var(--pen);padding:6px 12px;background:var(--card);border-radius:0 8px 8px 0}
.model span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--pen);text-decoration:underline;font-size:14px}
.vis{border-radius:10px;border:1.5px solid var(--line);background:var(--card);overflow:hidden}
.vis svg{display:block;width:100%;height:auto}
.vis.narrow svg{max-width:430px;margin:0 auto}
.vis .cap{font-size:12px;color:var(--muted);padding:0 12px 8px}
.big{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted);font-weight:600}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rlist li{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.rlist li .m{font-family:var(--f-hand);font-size:22px;font-weight:700;line-height:1}
.rlist li.r .m{color:var(--ok)} .rlist li.w .m{color:var(--bad)}
.rlist li div{min-width:0}
.rlist li p{margin:0;font-size:14px;overflow-wrap:anywhere}
.foot{font-size:12px;color:var(--muted);max-width:70ch}
/* Spickzettel */
.cheat{display:flex;flex-direction:column;gap:12px}
.cheat h2{font-size:22px}
.cheat .merk{font-family:var(--f-hand);font-size:20px;line-height:1.25;color:var(--pen);background:color-mix(in srgb,var(--marker) 35%,transparent);padding:4px 10px;border-radius:6px;align-self:flex-start}
.icgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:600px){.icgrid{grid-template-columns:1fr 1fr 1fr}}
.ic{border:1.5px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ic svg{width:100%;height:auto;display:block}
.ic b{font-size:15px}
.ic span{font-size:13px;color:var(--muted);line-height:1.35}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.legend li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}
.legend li i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;font-size:14px}
.legend li span{font-size:15px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
/* Simulator */
.simstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.simstat div{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.simstat b{font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.simstat span{font-size:12px;color:var(--muted)}
.win{background:var(--ok-soft);border-radius:12px;padding:14px 16px}
.win b{font-family:var(--f-hand);font-size:24px;color:var(--ok);display:block;line-height:1.1}
/* SVG-Skizzen */
svg text{font-family:var(--f-body)}
.dog .d-body,.dog .d-leg{fill:var(--dog);stroke:var(--ink);stroke-width:1.4px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.dog .d-far{fill:var(--dog2);stroke:var(--ink);stroke-width:1.4px;vector-effect:non-scaling-stroke}
.dog .d-ear{fill:var(--ear);stroke:var(--ink);stroke-width:1.4px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.dog .d-to{fill:none;stroke:var(--ink);stroke-width:5.6px;stroke-linecap:round;vector-effect:non-scaling-stroke}
.dog .d-ti{fill:none;stroke:var(--dog);stroke-width:3px;stroke-linecap:round;vector-effect:non-scaling-stroke}
.dog .d-eye,.dog .d-nose{fill:var(--ink)}
.dog .d-womb{fill:var(--womb);stroke:var(--warm);stroke-width:1.3px;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}
.dog .d-mk{fill:none;stroke:var(--marker);stroke-opacity:var(--marker-op);stroke-width:18px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.dog .d-fur{fill:none;stroke:var(--ink);stroke-width:1.1px;stroke-linecap:round;vector-effect:non-scaling-stroke}
.sk-ln{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sk-ar{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sk-t{fill:var(--ink);font-size:10px}
.sk-ts{fill:var(--muted);font-size:9px}
.sk-tb{fill:var(--ink);font-size:11px;font-weight:600}
.sk-mk{fill:var(--marker);fill-opacity:var(--marker-op)}
.sk-mkl{fill:none;stroke:var(--marker);stroke-opacity:var(--marker-op);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.sk-ground{stroke:var(--line);stroke-width:2}
.bone{fill:var(--bone);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.hole{fill:var(--hole);stroke:var(--ink);stroke-width:1.3}
.tooth{stroke:#1f2a33;stroke-width:1.1;stroke-linejoin:round;fill:var(--tooth)}
.tooth.c-sch{fill:var(--t-sch)} .tooth.c-fang{fill:var(--t-fang)} .tooth.c-back{fill:var(--t-back)} .tooth.c-reiss{fill:var(--t-reiss)}
.t-mk{fill:none;stroke:var(--marker);stroke-opacity:.95;stroke-width:8;stroke-linejoin:round}
.nbox{fill:var(--card);stroke:var(--ink);stroke-width:1.3}
.ntx{fill:var(--ink);font-size:12px;font-weight:600}
.zone{fill:transparent;stroke:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.zone.sel{fill:var(--marker);fill-opacity:.28;stroke:var(--pen);stroke-width:2;stroke-dasharray:5 4}
.zone.good{fill:var(--ok);fill-opacity:.16;stroke:var(--ok);stroke-width:2.5}
.zone.badz{fill:var(--bad);fill-opacity:.14;stroke:var(--bad);stroke-width:2.5}
.zone.pick{stroke:var(--pen);stroke-width:2.5;fill:var(--pen);fill-opacity:.1}
.leaf{fill:var(--leaf);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.trap{fill:var(--trap)}
.stem{fill:none;stroke:var(--leaf);stroke-width:4;stroke-linecap:round}
.frog{fill:var(--frog);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.lung{fill:var(--lung);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.warmln{fill:none;stroke:var(--warm);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.coldln{fill:none;stroke:var(--cold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.warmtx{fill:var(--warm);font-size:10px;font-weight:600}
.coldtx{fill:var(--cold);font-size:10px;font-weight:600}
.coldbg{fill:var(--coldbg)} .warmbg{fill:var(--warmbg)}
.sun{fill:var(--sun);stroke:var(--ink);stroke-width:1.2}
.sunr{stroke:var(--sun);stroke-width:2.4;stroke-linecap:round}
.therm{fill:var(--card);stroke:var(--ink);stroke-width:1.3}
.thermf{fill:var(--warm)}
.milk{fill:var(--milk);stroke:var(--ink);stroke-width:1}
.cell{fill:var(--cell);stroke:var(--cellk);stroke-width:1.6}
.nuc{fill:var(--cellk)}
.lens{fill:none;stroke:var(--ink);stroke-width:5}
.handle{stroke:var(--ink);stroke-width:10;stroke-linecap:round}
.egg{fill:var(--card);stroke:var(--ink);stroke-width:1.4}
.xx{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.bar{fill:var(--pen)} .bar.goal{fill:var(--ok)}
.goalln{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:5 4}
</style>
</head>

<div class="wrap" id="app"></div>

<script>
"use strict";
/* ---------- Hilfen ---------- */
const $=(s,el=document)=>el.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f1=n=>(+n).toFixed(1).replace(/\.0$/,"");
function canon(s){return String(s).toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u").replace(/[^a-z0-9]/g,"");}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const STOREKEY="hundecheck5";

   Füße bei y = 54 + Beinlänge. o: {x,y,s,ear,leg,earUp,run,legsMk,fur,womb} */
function dogG(o){
 const L=o.leg==null?20:o.leg, E=o.ear==null?12:o.ear, s=o.s||1, H=L+2;
 const rot=(a,cx)=>o.run?` transform="rotate(${a} ${cx} 54)"`:"";
 const ear=o.earUp?`<path class="d-ear" d="M14,16 L20,2 L27,18 Z"/>`
   :`<ellipse class="d-ear" cx="21" cy="${f1(16+E/2)}" rx="5" ry="${f1(E/2+2)}" transform="rotate(-8 21 16)"/>`;
 const legs=[[32,"d-far",18],[80,"d-far",-14],[24,"d-leg",-26],[71,"d-leg",26]];
 const mk=o.legsMk?legs.map(([x])=>`<path class="d-mk" d="M${x+4},56 v${H-4}"/>`).join(""):"";
 const fur=o.fur?`<path class="d-fur" d="M30,38 l-2,-5 M38,38 l-1,-5 M46,38 l0,-5 M54,38 l1,-5 M62,38 l1,-5 M70,38 l2,-5 M78,38 l3,-4 M34,60 l-1,4 M44,60 l0,4 M54,60 l0,4 M64,60 l1,4"/>`:"";
 const womb=o.womb?`<ellipse class="d-womb" cx="52" cy="50" rx="17" ry="8.5"/><circle class="d-body" cx="46" cy="50" r="4.2"/><ellipse class="d-body" cx="54" cy="51.5" rx="6.5" ry="4"/><ellipse class="d-ear" cx="47.5" cy="47" rx="1.8" ry="3" transform="rotate(30 47.5 47)"/>`:"";
 return `<g transform="translate(${f1(o.x)},${f1(o.y)}) scale(${s})" class="dog">${mk}
 <path class="d-to" d="M86,45 Q98,41 98,27"/><path class="d-ti" d="M86,45 Q98,41 98,27"/>
 ${legs.map(([x,c,a])=>`<rect class="${c}" x="${x}" y="52" width="${c==="d-leg"?8:7}" height="${H}" rx="3.5"${rot(a,x+4)}/>`).join("")}
 <path class="d-body" d="M24,44 L12,24 L30,20 L38,40 Z"/>

 </g>`;
}

const sunG=(x,y,r)=>{let s="";for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<line class="sunr" x1="${f1(x+Math.cos(a)*(r+3))}" y1="${f1(y+Math.sin(a)*(r+3))}" x2="${f1(x+Math.cos(a)*(r+8))}" y2="${f1(y+Math.sin(a)*(r+8))}"/>`;}return s+`<circle class="sun" cx="${x}" cy="${y}" r="${r}"/>`;};

 const row=(y,list)=>list.map(([x,e])=>dogG({x,y,s,ear:e})).join("");
 const num=(x,y,n)=>`<circle cx="${x}" cy="${y}" r="9" style="fill:var(--card);stroke:var(--ink);stroke-width:1.3"/><text class="ntx" x="${x}" y="${y+4.3}" text-anchor="middle">${n}</text>`;
 const HL={1:[172,54,70,36],2:[170,136,82,58],3:[172,244,186,36]};
 let g=st?`<rect class="sk-mk" x="${HL[st][0]}" y="${HL[st][1]}" width="${HL[st][2]}" height="${HL[st][3]}" rx="10"/>`:"";
 g+=`<text class="sk-tb" x="6" y="36">Eltern</text>`+row(8,[[150,12],[240,11]]);
 g+=arrow(208,58,208,86)+num(188,72,1);
 g+=`<text class="sk-tb" x="6" y="118">Welpen</text>`+row(90,[[84,8],[152,14],[220,22],[288,11]]);
 g+=`<ellipse cx="246" cy="112" rx="36" ry="27" style="fill:none;stroke:var(--pen);stroke-width:2;stroke-dasharray:5 3"/><text class="sk-ts" x="246" y="152" text-anchor="middle">längste Ohren</text>`;
 g+=arrow(234,158,210,190)+num(190,168,2);
 g+=`<text class="sk-tb" x="6" y="226">neues Paar</text>`+row(198,[[150,22],[250,23]])+`<text class="sk-ts" x="280" y="194" text-anchor="middle">aus anderer Familie</text>`;
 g+=`<path class="sk-ar" style="stroke-dasharray:5 4" d="M208,248 L208,272"/>`+arrow(208,266,208,276)+num(188,262,3)+`<text class="sk-ts" x="222" y="266">nach vielen Generationen</text>`;
 g+=`<text class="sk-tb" x="6" y="314">neue Rasse</text>`+row(286,[[110,31],[190,34],[270,32]]);

/* ---------- Wurf von Welpen zum Antippen ---------- */
function litterSVG(v,zones){const n=v.vals.length,W=82,ground=200;let g="",top=ground;
 v.vals.forEach((val,i)=>{let o={ear:12,leg:16,s:.68};if(v.trait==="ear")o.ear=val;if(v.trait==="leg")o.leg=val;if(v.trait==="size")o.s=val;
  const h=(54+o.leg+2)*o.s;const cx=i*W+W/2;o.x=cx-45*o.s;o.y=ground-h;top=Math.min(top,o.y+10*o.s);g+=dogG(o);
  g+=`<text class="sk-tb" x="${cx}" y="${ground+17}" text-anchor="middle">${"ABCDE"[i]}</text>`;});
 const y0=Math.floor(top-8);
 if(zones)v.vals.forEach((_,i)=>{g+=`<rect class="zone" data-z="${"ABCDE"[i]}" x="${i*W+2}" y="${y0+2}" width="${W-4}" height="${ground+22-y0}" rx="8"/>`;});
 return svgWrap(`0 ${y0} ${n*W} ${ground+26-y0}`,`<line class="sk-ground" x1="4" y1="${ground}" x2="${n*W-4}" y2="${ground}"/>`+g,"Welpen A bis D");
}
function visualSVG(v,zones){if(!v)return "";
 if(v.type==="icon")return ICONS[v.n]();
 if(v.type==="skull")return skullSVG(Object.assign({},v,{zones}));
 if(v.type==="breed")return breedSVG(v);
 if(v.type==="litter")return litterSVG(v,zones);
 return "";}

function mc(topic,p,opts,correct,x,extra){const o=shuffle(opts);return Object.assign({topic,k:"mc",p,o,a:o.indexOf(correct),x},extra||{});}
const M=(topic,p,opts,x,extra)=>mc(topic,p,opts,opts[0],x,extra);
const T=(topic,p,acc,x,extra)=>Object.assign({topic,k:"text",p,acc,show:acc[0],x},extra||{});
const K=(l,a)=>({l,a});const KR=(l,re)=>({l,re:re.source});
const O=(topic,p,keys,need,model,x,extra)=>Object.assign({topic,k:"open",p,keys,need,model,x},extra||{});
/* Zuordnen: Paare [links, rechts]; n = wie viele Paare gezogen werden */
const MA=(topic,p,pairs,x,n,extra)=>()=>{const ps=extra&&extra.keep?pairs.slice():n?pick(pairs,n):shuffle(pairs);const rights=shuffle([...new Set(ps.map(q=>q[1]))]);return Object.assign({topic,k:"match",s:"special",p,pairs:ps,rights,x},extra||{});};
/* Reihenfolge */
const OR=(topic,p,items,x)=>()=>{let shown=shuffle(items);while(shown.join("|")===items.join("|"))shown=shuffle(items);return {topic,k:"order",s:"special",p,items,shown,x};};
/* Mehrfachauswahl */
const MU=(topic,p,right,wrong,x,nr,nw)=>()=>{const r=nr?pick(right,nr):right.slice(),w=nw?pick(wrong,nw):wrong.slice();const o=shuffle(r.concat(w));return {topic,k:"multi",s:"special",p,o,a:r.map(t=>o.indexOf(t)),x};};

 finish(ok,"angetippt: "+(q.names[ST.sel]||ST.sel),q.names[q.target]||q.target,ok?null:"Grün umrandet ist die richtige Stelle.");}
function checkMatch(){if(ST.done)return;const q=ST.qs[ST.i];const rows=[...$("#ans").querySelectorAll(".mrow")];let all=true;const user=[];
 rows.forEach((r,i)=>{const sel=r.querySelector("select");const ok=sel.value===q.pairs[i][1];if(!ok)all=false;user.push(q.pairs[i][0]+" → "+(sel.value||"–"));sel.disabled=true;r.classList.add(ok?"right":"wrong");
  if(!ok)r.insertAdjacentHTML("beforeend",`<span class="fix">Richtig: ${esc(q.pairs[i][1])}</span>`);});
 $("#go").disabled=true;finish(all,user.join("; "),all?"":q.pairs.map(p=>p[0]+" → "+p[1]).join("; "));}
function checkOrder(){if(ST.done)return;const q=ST.qs[ST.i];const user=ST.seq.map(i=>q.shown[i]);const ok=user.join("|")===q.items.join("|");
 $("#ans").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const i=+b.dataset.i;const pos=ST.seq.indexOf(i);b.classList.add(q.items[pos]===q.shown[i]?"right":"wrong");});
 $("#go").disabled=true;$("#reset").disabled=true;
 finish(ok,user.map((t,i)=>(i+1)+". "+t).join(" "),ok?"":"siehe Reihenfolge unten",null,ok?"":`<p>Richtige Reihenfolge:</p><ol>${q.items.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>`);}
function checkMulti(){if(ST.done)return;const q=ST.qs[ST.i];const corr=new Set(q.a);const ok=corr.size===ST.msel.size&&[...corr].every(i=>ST.msel.has(i));
 $("#ans").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(corr.has(i))b.classList.add(ST.msel.has(i)?"right":"missed");else if(ST.msel.has(i))b.classList.add("wrong");});
 $("#go").disabled=true;
 finish(ok,[...ST.msel].map(i=>q.o[i]).join(", "),q.a.map(i=>q.o[i]).join(", "),ok?null:"Gestrichelt grün umrandet: richtig, aber nicht ausgewählt.");}

function renderResult(){
 const n=ST.qs.length,sc=ST.log.filter(l=>l.ok).length,pct=Math.round(sc/n*100);const s=store.get();s.best=s.best||{};
 if(TOPICS.some(t=>t.id===ST.id))s.best[ST.id]=Math.max(s.best[ST.id]||0,pct);store.set(s);
 const msg=pct>=90?"Sehr stark. Das sitzt.":pct>=75?"Gut! Schau dir die Fehler unten noch einmal an.":pct>=50?"Ordentlich, aber da geht noch was. Übe die falschen Fragen gleich nochmal.":"Hier lohnt sich Üben. Schau in den Spickzettel und nimm dir die Themen einzeln vor.";
 const wrong=ST.log.filter(l=>!l.ok);
 app.innerHTML=`<header class="head"><span class="eyebrow">${esc(ST.title)}</span><div class="big">${pct} %<small> · ${sc} von ${n} richtig</small></div><p style="font-family:var(--f-hand);font-size:22px;color:var(--pen);margin:0">${esc(msg)}</p></header>
 <div class="row">${wrong.length?`<button class="btn" id="redo">Fehler gleich üben (${wrong.length})</button>`:""}<button class="btn ghost" id="again">Neue Runde</button><button class="btn ghost" id="home">Zur Übersicht</button></div>
 <section class="sec"><h3>Alle Fragen</h3><ol class="rlist">${ST.log.map(l=>`<li class="${l.ok?"r":"w"}"><span class="m">${l.ok?"✓":"✗"}</span><div><p>${esc(l.q.p)}</p>${l.ok?"":`<p class="muted">Deine Antwort: ${esc(l.user||"–")}${l.q.k==="open"||l.q.k==="order"?"":" · Richtig: <b>"+esc(l.corr||"")+"</b>"}</p>${l.q.k==="open"?`<p class="muted">Musterantwort: ${esc(l.q.model)}</p>`:""}${l.q.k==="order"?`<p class="muted">Richtig: ${esc(l.q.items.map((t,i)=>(i+1)+". "+t).join(" "))}</p>`:""}`}</div></li>`).join("")}</ol></section>`;
 $("#home").onclick=renderHome;
 $("#again").onclick=()=>{if(ST.id==="exam")startExam();else if(ST.id==="wrong")startWrong();else startTopic(ST.id);};
 if(wrong.length)$("#redo").onclick=()=>begin("Fehler üben","wrong",shuffle(wrong.map(l=>l.q)));
 window.scrollTo(0,0);
}

/* =====================================================================
   SPICKZETTEL
   ===================================================================== */
function renderCheat(){
 const icCard=(m)=>`<div class="ic">${ICONS[m.ic]()}<b>${esc(m.n)}</b><span>${esc(m.d)}</span></div>`;
 const col={sch:"var(--t-sch)",fang:"var(--t-fang)",back:"var(--t-back)",reiss:"var(--t-reiss)"};
 app.innerHTML=`<div class="qbar"><button class="x" id="quit">✕ Zurück</button><div class="prog"><span>Spickzettel · alle vier Themen</span></div></div>
 <article class="card cheat"><span class="eyebrow">Thema 1 · Buch S. 14/15</span><h2>Kennzeichen von Lebewesen</h2>
  <p style="margin:0">Etwas ist nur dann ein Lebewesen, wenn es <b>alle</b> Kennzeichen zeigt. Der Roboterhund bewegt sich und reagiert auf Geräusche, wächst aber nicht, pflanzt sich nicht fort, hat keinen Stoffwechsel und besteht nicht aus Zellen.</p>
  <span class="merk">Merksatz: ${esc(MERKSATZ)}</span>
  <div class="icgrid">${Object.values(KZ).map(icCard).join("")}</div>

 <article class="card cheat"><span class="eyebrow">Thema 2 · Buch S. 27</span><h2>Das Hundegebiss: ein Raubtiergebiss</h2>
  <div class="vis">${skullSVG({colored:true,numbers:true})}</div>
  <ul class="legend">${Object.keys(TG).map(g=>`<li><i style="background:${col[g]}">${TNUM[g]}</i><span><b>${TG[g]}</b>: ${TFN[g]}${g==="reiss"?" (besonders kräftiger Backenzahn, in jeder Zahnreihe einer)":g==="fang"?" (lang und spitz)":""}</span></li>`).join("")}</ul>
  <span class="merk">Von vorne nach hinten: schaben – festhalten – zerreißen – Knochen knacken</span></article>
 <article class="card cheat"><span class="eyebrow">Thema 3 · Mappe · Buch S. 31</span><h2>Kennzeichen der Säugetiere</h2>
  <div class="icgrid">${Object.values(SM).map(icCard).join("")}</div>
  <p style="margin:0">Fortpflanzung: Hündin und Rüde paaren sich, <b>innere Befruchtung</b> (Spermienzelle + Eizelle verschmelzen im Körper der Hündin), etwa <b>60 Tage</b> Schwangerschaft, bis zu zehn Welpen. Welpen kommen blind und taub zur Welt: <b>Nesthocker</b>. Der Hund hat eine Wirbelsäule: Er ist auch ein <b>Wirbeltier</b>.</p></article>
 <article class="card cheat"><span class="eyebrow">Thema 4 · Arbeitsblatt · Buch S. 31/32</span><h2>Züchtung</h2>
  <div class="vis">${breedSVG({})}</div>
  <ol class="steps"><li>Zwei Hunde mit dem gewünschten Merkmal auswählen und paaren.</li><li>Die Welpen ähneln den Eltern, sind aber leicht verschieden (<b>Vielfalt, Variabilität</b>).</li><li>Den Welpen mit dem stärksten Merkmal mit einem passenden Hund aus einer anderen Familie paaren.</li><li>Über <b>viele Generationen</b> wiederholen, bis sich das Merkmal <b>verfestigt</b>: eine neue <b>Rasse</b>.</li></ol>
  <span class="merk">Auswählen – Paaren – Wiederholen</span>
  <p style="margin:0">Vorfahre aller Hunde ist der <b>Wolf</b>. Vererbt werden Merkmale aus der <b>Erbinformation</b> (Fellfarbe, Körpergröße, Ohren- und Schwanzform). <b>Erlerntes</b> wie „Sitz“ wird <b>nicht vererbt</b>. Heute gibt es mehr als 400 Hunderassen, entstanden in etwa 10 000 Jahren.</p></article>
 <div class="row"><button class="btn" id="exam">Jetzt die Probe-Klassenarbeit machen</button><button class="btn ghost" id="home">Zur Übersicht</button></div>`;
 $("#quit").onclick=renderHome;$("#home").onclick=renderHome;$("#exam").onclick=startExam;window.scrollTo(0,0);

/* =====================================================================
   ZÜCHTUNGS-SIMULATOR
   ===================================================================== */
const SIMGOAL=26;let SIM=null;
function litter(mean){const sx=shuffle(["Rüde","Rüde","Rüde","Hündin","Hündin","Hündin"]);
 return sx.map(sex=>({sex,ear:Math.max(3,Math.min(38,Math.round(mean+(Math.random()*2-1)*6)))}));}
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
function renderSim(reset){
 if(reset||!SIM){const p=litter(8);SIM={gen:1,pups:p,sel:{},hist:[avg(p.map(d=>d.ear))]};}
 const pups=SIM.pups,a=avg(pups.map(d=>d.ear)),done=a>=SIMGOAL;
 const cw=110,chh=104;let g="";
 pups.forEach((d,i)=>{const cx=(i%3)*cw,cy=Math.floor(i/3)*chh;const chosen=SIM.sel[d.sex]===i;
  g+=`<rect class="zone${chosen?" pick":""}" data-i="${i}" x="${cx+3}" y="${cy+3}" width="${cw-6}" height="${chh-6}" rx="10"/>`;
  g+=`<g style="pointer-events:none">${dogG({x:cx+16,y:cy+8,s:.72,ear:d.ear})}<text class="sk-tb" x="${cx+cw/2}" y="${cy+88}" text-anchor="middle">${d.sex}</text><text class="sk-ts" x="${cx+cw/2}" y="${cy+99}" text-anchor="middle">Ohrlänge ${d.ear}</text></g>`;});
 const H=SIM.hist,slot=Math.min(40,296/Math.max(H.length,6)),bw=slot-4;let ch=`<line class="goalln" x1="30" x2="330" y1="${100-SIMGOAL*2.4}" y2="${100-SIMGOAL*2.4}"/><text class="sk-ts" x="332" y="${100-SIMGOAL*2.4+3}" text-anchor="end" dy="-6">Ziel</text>`;
 H.forEach((v,i)=>{const h=v*2.4;ch+=`<rect class="bar${v>=SIMGOAL?" goal":""}" x="${f1(34+i*slot)}" y="${f1(100-h)}" width="${f1(bw)}" height="${f1(h)}" rx="3"/><text class="sk-ts" x="${f1(34+i*slot+bw/2)}" y="112" text-anchor="middle">${i+1}</text>`;});
 ch+=`<line class="sk-ground" x1="30" x2="330" y1="100" y2="100"/><text class="sk-ts" x="2" y="12">Ø Ohrlänge</text>`;
 app.innerHTML=`<div class="qbar"><button class="x" id="quit">✕ Zurück</button><div class="prog"><span>Züchte selbst · Ziel: Rasse mit langen Ohren</span></div></div>
 <article class="card"><h2 style="font-size:22px">Züchte Hunde mit langen Ohren</h2>
  <p style="margin:0">Das ist der Wurf von Generation ${SIM.gen}. Wähle <b>einen Rüden</b> und <b>eine Hündin</b> als Eltern für den nächsten Wurf. Schaffst du es, dass die Welpen im Durchschnitt eine Ohrlänge von ${SIMGOAL} erreichen?</p>
  <div class="simstat"><div><b>${SIM.gen}</b><span>Generation</span></div><div><b>${a.toFixed(1)}</b><span>Ø Ohrlänge</span></div><div><b>${Math.max(...pups.map(d=>d.ear))}</b><span>längste Ohren</span></div></div>
  <div class="vis" id="simvis">${svgWrap(`0 0 ${3*cw} ${2*chh}`,g,"Wurf mit sechs Welpen")}</div>
  ${done?`<div class="win"><b>Geschafft in ${SIM.gen-1} Generationen!</b>Fast alle Welpen haben jetzt lange Ohren. Das Merkmal hat sich verfestigt: Du hast eine neue Rasse gezüchtet. Genau so sind aus dem Wolf über viele Generationen die Hunderassen entstanden.</div>`:""}
  <div class="row"><button class="btn" id="mate" ${SIM.sel["Rüde"]!=null&&SIM.sel["Hündin"]!=null&&!done?"":"disabled"}>Paaren und nächsten Wurf ansehen</button><button class="btn ghost small" id="rand" ${done?"disabled":""}>Zufällig paaren</button><button class="btn ghost small" id="restart">Neu starten</button></div>
  <p class="hint" style="margin:0">Beobachte: Die Geschwister ähneln sich, sind aber nie ganz gleich (Vielfalt). Wenn du zufällig paarst, ändern sich die Ohren kaum. Erst die gezielte Auswahl über mehrere Generationen bringt das Ziel näher.</p>
  <div class="vis"><svg viewBox="0 0 340 118" role="img" aria-label="Durchschnittliche Ohrlänge je Generation">${ch}</svg><div class="cap">Durchschnittliche Ohrlänge der Welpen in jeder Generation</div></div>
 </article>`;
 $("#quit").onclick=renderHome;$("#restart").onclick=()=>renderSim(true);
 $("#simvis").querySelectorAll(".zone").forEach(z=>z.addEventListener("click",()=>{if(done)return;const i=+z.dataset.i;const d=pups[i];SIM.sel[d.sex]=SIM.sel[d.sex]===i?null:i;renderSim(false);}));
 const mate=(m,f)=>{const mean=(pups[m].ear+pups[f].ear)/2;SIM.pups=litter(mean);SIM.gen++;SIM.sel={};SIM.hist.push(avg(SIM.pups.map(d=>d.ear)));renderSim(false);};
 $("#mate").onclick=()=>mate(SIM.sel["Rüde"],SIM.sel["Hündin"]);
 $("#rand").onclick=()=>{const ms=pups.map((d,i)=>d.sex==="Rüde"?i:-1).filter(i=>i>=0),fs=pups.map((d,i)=>d.sex==="Hündin"?i:-1).filter(i=>i>=0);mate(ms[rnd(ms.length)],fs[rnd(fs.length)]);};
}

renderHome();
</script>
